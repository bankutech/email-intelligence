services:
  - type: web
    name: email-intelligence-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_PORT
        value: 10000
      - key: DATABASE_PATH
        value: /data/emails.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
